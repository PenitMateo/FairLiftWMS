<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FairLift — Live Tracking (Philippines)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --accent: #3E5879;
      --accent-dark: #2E415E;
      --bg: #f4f5f7;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      display: flex;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
      color: #333;
    }

    /* Sidebar */
    .sidebar {
      width: 230px;
      background: var(--accent);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Push logout to bottom */
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      box-shadow: 2px 0 8px rgba(0,0,0,0.15);
      z-index: 200;
    }
    .sidebar h2 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin: 30px 0;
      letter-spacing: 1px;
    }
    .nav-link {
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 8px;
      margin: 4px 10px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.25s ease;
    }
    .nav-link i { font-size: 1.1rem; }
    .nav-link:hover { background: rgba(255,255,255,0.15); transform: translateX(3px); }
    .nav-link.active {
      background: #fff;
      color: var(--accent);
      font-weight: 600;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
    }

    /* Logout Button */
    .logout {
      margin: 0 12px 20px;
      background: #e74c3c;  /* red */
      color: #fff;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }
    .logout:hover { background: #c0392b; }

    /* Main Area */
    .main {
      margin-left: 230px;
      display: flex;
      width: calc(100% - 230px);
      height: 100vh;
    }

    #map {
      flex: 1;
      height: 100vh;
      width: 100%;
      background: #e0e0e0;
    }

    /* Floating Info Panel */
    .panel {
      position: absolute;
      top: 100px;
      right: 25px;
      width: 370px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
      padding: 22px;
      z-index: 500;
      animation: fadeIn 0.4s ease;
    }
    .panel h3 {
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .panel p { font-size: 14px; color: #555; margin-bottom: 12px; }
    .panel input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 15px;
    }
    .panel .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: 0.3s;
    }
    .panel .btn:hover { background: var(--accent-dark); }
    .panel .btn.secondary { background: #6c757d; }
    .panel .btn.secondary:hover { background: #555; }

    /* Parcel Card Styling */
    #parcelCard {
      display: none;
      margin-top: 16px;
      border-top: 1px solid #eee;
      padding-top: 14px;
      background: #f9f9f9;
      border-radius: 10px;
      padding: 16px;
    }
    #parcelCard h4 { font-size: 18px; color: var(--accent-dark); margin-bottom: 10px; font-weight: 700; }
    #parcelCard div { font-size: 16px; color: #333; margin-bottom: 8px; }
    #parcelCard strong { color: var(--accent); font-weight: 600; }

    /* Status Color */
    .status-green { color: #28a745; font-weight: 700; }
    .status-yellow { color: #e6b800; font-weight: 700; }
    .status-red { color: #d9534f; font-weight: 700; }

    /* Message Box */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }
    .message-box {
      background: #fff;
      padding: 22px 28px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      width: 320px;
      text-align: center;
      animation: fadeIn 0.25s ease;
    }
    .message-box h4 { margin: 0 0 10px; color: var(--accent); font-size: 18px; }
    .message-box p { color: #333; font-size: 14px; margin-bottom: 16px; }
    .message-box button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
    }
    .message-box button:hover { background: var(--accent-dark); }

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <nav class="sidebar">
    <div>
      <h2>FAIRLIFT</h2>
      <a href="/static/DashBoard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/static/Calendar.html" class="nav-link"><i class="bi bi-calendar3"></i> Calendar</a>
      <a href="/static/warehouse.html" class="nav-link"><i class="bi bi-box-seam"></i> Warehouse</a>
      <a href="/static/archived.html" class="nav-link"><i class="bi bi-archive"></i> Archived Parcels</a>
      <a href="/static/tracking_live_auto.html" class="nav-link active"><i class="bi bi-truck"></i> Live Tracking</a>
      <a href="/static/add_parcel.html" class="nav-link"><i class="bi bi-plus-circle"></i> Add Parcel</a>
      <a href="/static/ManageVehicles.html" class="nav-link"><i class="bi bi-truck"></i><span> Manage Vehicles</span></a>
      <a href="/static/settings.html" class="nav-link"><i class="bi bi-gear"></i> Settings</a>
    </div>
    <a href="/static/Login.html" class="logout">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </nav>

  <!-- Main -->
  <div class="main">
    <div id="map"></div>
    <div class="panel">
      <h3>Auto Tracker (🇵🇭)</h3>
      <p>Track parcels from the Las Piñas warehouse to their Philippine destinations.</p>
      <input id="trackingInput" placeholder="e.g. FL-2025-001">
      <div style="display:flex;gap:8px;">
        <button id="trackBtn" class="btn">Track</button>
        <button id="autoBtn" class="btn secondary">Auto-Load</button>
      </div>

      <div id="parcelCard">
        <h4 id="pn">Tracking: --</h4>
        <div><strong>From:</strong> <span id="fromText">--</span></div>
        <div><strong>To:</strong> <span id="toText">--</span></div>
        <div style="margin-top:8px;"><strong>Status:</strong> <span id="statusText">--</span></div>
      </div>
    </div>
  </div>

  <!-- Message Box -->
  <div id="overlay">
    <div class="message-box">
      <h4 id="msgTitle">Notice</h4>
      <p id="msgText">Message goes here.</p>
      <button onclick="closeMsg()">OK</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const MAPTILER_KEY = "LYrqvcgKxgR314TOr230";
    const WAREHOUSE_ADDRESS = "Warehouse 51 Tionquiao St. BF Martinville, Manuyo Dos, City of Las Piñas, 1744, Philippines";

    const overlay = document.getElementById('overlay');
    const msgTitle = document.getElementById('msgTitle');
    const msgText = document.getElementById('msgText');
    function showMsg(title, text) { msgTitle.textContent = title; msgText.textContent = text; overlay.style.display = 'flex'; }
    function closeMsg() { overlay.style.display = 'none'; }

    const map = L.map('map', { minZoom: 5, maxBounds: [[4.4,116.0],[21.3,127.0]] }).setView([12.8797,121.7740], 6);
    L.tileLayer(`https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
      attribution: '&copy; OpenStreetMap contributors | MapTiler',
      crossOrigin: true
    }).addTo(map);

    let routeLayer = null;
    let markers = [];
    let parcels = [];

    async function loadParcels() {
      try { const res = await fetch("/api/parcels", { credentials: 'include' }); parcels = await res.json(); }
      catch { showMsg("Error", "Cannot load warehouse parcels."); }
    }

    async function getCoords(address) {
      const res = await fetch(`https://api.maptiler.com/geocoding/${encodeURIComponent(address + ', Philippines')}.json?key=${MAPTILER_KEY}`);
      const data = await res.json();
      if (!data.features?.length) throw new Error("Address not found: " + address);
      const [lng, lat] = data.features[0].geometry.coordinates;
      return [lat, lng];
    }

    async function drawRoute(fromAddress, toAddress) {
      try {
        const [fromLat, fromLng] = await getCoords(fromAddress);
        const [toLat, toLng] = await getCoords(toAddress);

        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`;
        const routeRes = await fetch(osrmUrl);
        const routeData = await routeRes.json();

        if (routeLayer) map.removeLayer(routeLayer);
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        const routeGeo = routeData.routes?.[0]?.geometry;
        if (routeGeo) {
          routeLayer = L.geoJSON(routeGeo, { style: { color: '#A3001E', weight: 5 } }).addTo(map);
          map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
        }

        const fromMarker = L.marker([fromLat, fromLng]).addTo(map).bindPopup("🏭 FairLift Warehouse");
        const toMarker = L.marker([toLat, toLng]).addTo(map).bindPopup("📍 Destination: " + toAddress);
        markers.push(fromMarker, toMarker);
      } catch {
        showMsg("Route Error", "Unable to draw route. Please check destination.");
      }
    }

    function showParcel(p) {
      document.getElementById('parcelCard').style.display = 'block';
      document.getElementById('pn').textContent = 'Tracking: ' + p.tracking_number;
      document.getElementById('fromText').textContent = WAREHOUSE_ADDRESS;
      document.getElementById('toText').textContent = p.destination;
      const statusEl = document.getElementById('statusText');
      statusEl.textContent = p.status;
      statusEl.className = '';
      const s = p.status.toLowerCase();
      if (s.includes('delivered')) statusEl.classList.add('status-green');
      else if (s.includes('in transit')) statusEl.classList.add('status-yellow');
      else if (s.includes('delay')) statusEl.classList.add('status-red');
      else statusEl.style.color = '#333';
    }

    document.getElementById('trackBtn').addEventListener('click', async () => {
      const tn = document.getElementById('trackingInput').value.trim();
      const p = parcels.find(x => x.tracking_number === tn);
      if (!p) return showMsg("Not Found", "Parcel not found in the database.");
      showParcel(p); await drawRoute(WAREHOUSE_ADDRESS, p.destination);
    });

    document.getElementById('autoBtn').addEventListener('click', async () => {
      if (!parcels.length) return showMsg("No Parcels", "No parcels found in the warehouse.");
      const p = parcels[0];
      document.getElementById('trackingInput').value = p.tracking_number;
      showParcel(p); await drawRoute(WAREHOUSE_ADDRESS, p.destination);
    });

    (async () => {
      try { const [lat, lng] = await getCoords(WAREHOUSE_ADDRESS);
        L.marker([lat, lng]).addTo(map).bindPopup("🏭 FairLift Warehouse — Las Piñas").openPopup();
        map.setView([lat, lng], 13);
      } catch {}
    })();

    loadParcels();
  </script>
</body>
</html>
