<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FairLift — Archived Parcels</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root {
  --accent: #3E5879;
  --accent-dark: #2E415E;
  --bg: #ffffff;
  --card: #ffffff;
  --muted: #666;
  font-family: 'Inter', sans-serif;
}

/* Reset */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: flex;
  min-height: 100vh;
  color: #333;
  background-color: var(--bg);
  font-family: 'Inter', sans-serif;
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: var(--accent);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  padding: 24px 16px;
  box-shadow: 3px 0 10px rgba(0,0,0,0.12);
}

.sidebar h2 {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 24px;
  letter-spacing: 1px;
}

.nav-link {
  color: #fff;
  text-decoration: none;
  display: flex;
  align-items: center;
  padding: 10px;
  border-radius: 8px;
  margin: 6px 0;
  transition: 0.25s;
  font-weight: 500;
}
.nav-link i { margin-right: 10px; font-size: 1.2rem; }
.nav-link:hover { background: rgba(255,255,255,0.15); }
.nav-link.active { background: #fff; color: var(--accent); font-weight: 600; }

.logout-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e74c3c;
  color: #fff;
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  gap: 8px;
  transition: 0.3s;
}
.logout-btn:hover { background: #c0392b; }

/* Main */
.main {
  margin-left: 240px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Header */
header {
  background: #fff;
  padding: 18px 26px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 {
  font-size: 18px;
  color: var(--accent);
  font-weight: 700;
}
header p { font-size: 13px; color: var(--muted); margin-top: 3px; }

/* Search Bar */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #f3f4f6;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
}
.search-bar i { color: var(--accent); font-size: 1rem; }
.search-bar input {
  border: none;
  outline: none;
  background: transparent;
  font-size: 14px;
  width: 200px;
  color: #333;
}

/* Card + Table */
.card {
  background: var(--card);
  margin: 24px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.05);
  overflow-x: auto;
  animation: fadeIn 0.4s ease-in-out;
}
@keyframes fadeIn { from {opacity:0;transform:translateY(8px);} to {opacity:1;transform:translateY(0);} }

table { width: 100%; border-collapse: collapse; min-width: 900px; }
th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
  font-size: 14px;
}
th { background: #f8f9fb; color: #444; font-weight: 600; }
tr:hover { background: #f2f4f7; }

/* Buttons */
.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 7px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: 0.3s;
}
.btn:hover { background: var(--accent-dark); transform: translateY(-1px); }

/* Footer */
footer {
  text-align: center;
  color: #777;
  padding: 16px 0;
  font-size: 13px;
  border-top: 1px solid #eee;
  background: #fff;
  margin-top: auto;
}

/* Modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: fadeIn 0.25s ease;
}
.modal-box {
  background: #fff;
  border-radius: 12px;
  padding: 26px 30px;
  width: 360px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  animation: pop 0.25s ease;
}
@keyframes pop { from{transform:scale(0.9);opacity:0;} to{transform:scale(1);opacity:1;} }
.modal-box h3 {
  color: var(--accent);
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 16px;
}
.modal-box p { color: #444; font-size: 14px; margin-bottom: 18px; text-align: center; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 70px; padding: 18px 8px; }
  .sidebar h2, .nav-link span { display: none; }
  .main { margin-left: 70px; }
  header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .search-bar input { width: 100px; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <div>
    <h2>FAIRLIFT</h2>
    <a href="/static/DashBoard.html" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    <a href="/static/Calendar.html" class="nav-link"><i class="bi bi-calendar3"></i><span>Calendar</span></a>
    <a href="/static/warehouse.html" class="nav-link"><i class="bi bi-box-seam"></i><span>Warehouse</span></a>
    <a href="/static/archived.html" class="nav-link active"><i class="bi bi-archive"></i><span>Archived Parcels</span></a>
    <a href="/static/tracking_live_auto.html" class="nav-link"><i class="bi bi-truck"></i><span>Live Tracking</span></a>
    <a href="/static/add_parcel.html" class="nav-link"><i class="bi bi-plus-circle"></i><span>Add Parcel</span></a>
    <a href="/static/ManageVehicles.html" class="nav-link"><i class="bi bi-truck"></i><span> Manage Vehicles</span></a>
    <a href="/static/settings.html" class="nav-link"><i class="bi bi-gear"></i><span>Settings</span></a>
  </div>
  <button class="logout-btn" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
</nav>

<!-- Main -->
<div class="main">
  <header>
    <div>
      <h1>Archived Parcels</h1>
      <p>View and manage previously stored parcels.</p>
    </div>
    <div class="search-bar">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" placeholder="Search archived parcels...">
    </div>
  </header>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Tracking #</th>
          <th>Size</th>
          <th>Weight</th>
          <th>Shipping Date</th>
          <th>Destination</th>
          <th>Status</th>
          <th>Location</th>
          <th>Assigned Vehicle</th> <!-- NEW -->
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>© 2025 FairLift International Logistics</footer>
</div>

<script>
let archivedParcels = [];

// Popup Message
function showMsg(title, text) {
  const modal = document.createElement("div");
  modal.className = "modal-bg";
  modal.innerHTML = `
    <div class="modal-box">
      <h3>${title}</h3>
      <p>${text}</p>
      <div style="text-align:center;">
        <button class="btn" onclick="this.closest('.modal-bg').remove()">OK</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

// Load Archived Parcels
async function loadArchived() {
  try {
    const res = await fetch('/api/parcels/archived', { credentials: 'include' });
    if (!res.ok) throw new Error("Failed to load archived parcels");
    const data = await res.json();
    archivedParcels = data;
    renderTable(data);
  } catch {
    showMsg("Error", "Failed to load archived parcels.");
  }
}

// Render Table
function renderTable(items) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  items.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.tracking_number || ''}</td>
      <td>${p.size || ''}</td>
      <td>${p.weight || ''}</td>
      <td>${p.arrival_date ? p.arrival_date.split('T')[0] : ''}</td>
      <td>${p.destination || ''}</td>
      <td>${p.status || ''}</td>
      <td>${p.location_rack || ''}</td>
      <td>${p.assigned_vehicle || '—'}</td>  <!-- NEW -->
      <td><button class="btn" onclick="restoreParcel(${p.id})"><i class="bi bi-arrow-counterclockwise"></i> Restore</button></td>`;
    tbody.appendChild(tr);
  });
}

// Restore Parcel
async function restoreParcel(id) {
  const res = await fetch(`/api/parcels/${id}/restore`, {
    method: 'POST',
    credentials: 'include'
  });
  if (res.ok) {
    showMsg("Success", "Parcel restored successfully!");
    loadArchived();
  } else showMsg("Error", "Failed to restore parcel.");
}

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  const term = e.target.value.toLowerCase();
  const filtered = archivedParcels.filter(p =>
    (p.tracking_number || '').toLowerCase().includes(term) ||
    (p.destination || '').toLowerCase().includes(term) ||
    (p.status || '').toLowerCase().includes(term) ||
    (p.assigned_vehicle || '').toLowerCase().includes(term)   // NEW
  );
  renderTable(filtered);
});

// Logout
document.getElementById('logoutBtn').onclick = () => {
  sessionStorage.clear();
  window.location.href = '/static/Login.html';
};

loadArchived();
</script>
</body>
</html>
