<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FairLift — Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root {
  --accent: #3E5879;
  --accent-light: #5A7299;
  --bg: #f8f9fa;
  --card-bg: #fff;
  --border: #dcdfe3;
  --text: #333;
  --text-muted: #666;
  font-family: "Inter", sans-serif;
}
* { box-sizing: border-box; margin:0; padding:0; }

/* Body & Layout */
body { display:flex; min-height:100vh; background: var(--bg); color: var(--text); }

/* Sidebar */
.sidebar {
  width:220px; background: var(--accent); color:#fff; display:flex; flex-direction:column;
  height:100vh; position:fixed; top:0; left:0; padding:25px 15px; box-shadow:2px 0 10px rgba(0,0,0,0.12);
}
.sidebar h2 { font-size:20px; font-weight:700; margin-bottom:30px; text-align:center; }
.nav-link {
  color:#fff; display:flex; align-items:center; padding:12px 14px; border-radius:8px;
  margin:6px 0; font-weight:500; text-decoration:none; transition:0.25s;
}
.nav-link i { margin-right:10px; font-size:1.2rem; }
.nav-link:hover { background: rgba(255,255,255,0.15); transform: translateX(3px); }
.nav-link.active { background:#fff; color:var(--accent); font-weight:600; }
.spacer { flex-grow:1; }
.logout {
  display:flex; align-items:center; justify-content:center;
  gap:6px; padding:10px; margin-top:10px; background:#e74c3c;
  border-radius:8px; font-weight:600; cursor:pointer; transition:0.3s;
}
.logout:hover { background:#c0392b; }

/* Main */
.main {
  margin-left:220px; flex-grow:1; display:flex; flex-direction:column; padding:30px 20px;
}

/* Header */
header { text-align:center; margin-bottom:30px; }
header h1 { font-size:28px; color: var(--accent); font-weight:700; }

/* Card & Table */
.settings-grid { display:grid; grid-template-columns:1fr; gap:20px; }
.card {
  background: var(--card-bg); border-radius:16px; padding:25px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08); transition:0.3s;
}
.card:hover { box-shadow:0 12px 30px rgba(0,0,0,0.12); }
.card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.card-header h3 { margin:0; color: var(--accent); font-size:18px; font-weight:600; }
.btn {
  background: var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:8px;
  cursor:pointer; font-weight:600; transition:0.25s; display:flex; align-items:center; gap:6px;
}
.btn:hover { background: var(--accent-light); }

table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); }
th { background:#f8f8f8; color:#555; }
tr:hover td { background:#f4f6fa; }
td i { color: var(--accent); cursor:pointer; font-size:1.1rem; }
td i:hover { color: var(--accent-light); }

/* Modals & Overlays */
.overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
  display:none; justify-content:center; align-items:center; z-index:1000;
}
.modal {
  background: var(--card-bg); border-radius:16px; padding:25px 20px;
  width:90%; max-width:360px; box-shadow:0 8px 25px rgba(0,0,0,0.15); text-align:center;
  display:flex; flex-direction:column; gap:12px;
}
.modal h4 { color: var(--accent); margin-bottom:10px; font-size:18px; }
.modal input { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; }
.modal button {
  background: var(--accent); color:#fff; border:none; border-radius:8px;
  padding:10px; cursor:pointer; font-weight:600; transition:0.25s;
}
.modal button:hover { background: var(--accent-light); }

footer { margin-top:30px; text-align:center; font-size:13px; color:var(--text-muted); }

.modal i { position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--accent); }

/* Responsive */
@media(max-width:768px){
  .sidebar { width:60px; padding:20px 6px; }
  .sidebar h2 { display:none; }
  .nav-link { justify-content:center; padding:10px 0; }
  .nav-link i { margin:0; font-size:1.3rem; }
  .nav-link span { display:none; }
  .main { margin-left:60px; padding:20px; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <h2>FAIRLIFT</h2>
  <a href="/static/DashBoard.html" class="nav-link"><i class="bi bi-speedometer2"></i> <span>Dashboard</span></a>
  <a href="/static/Calendar.html" class="nav-link"><i class="bi bi-calendar3"></i> <span>Calendar</span></a>
  <a href="/static/warehouse.html" class="nav-link"><i class="bi bi-box-seam"></i> <span>Warehouse</span></a>
  <a href="/static/archived.html" class="nav-link"><i class="bi bi-archive"></i> <span>Archived Parcels</span></a>
  <a href="/static/tracking_live_auto.html" class="nav-link"><i class="bi bi-truck"></i> <span>Live Tracking</span></a>
  <a href="/static/add_parcel.html" class="nav-link"><i class="bi bi-plus-circle"></i> <span>Add Parcel</span></a>
  <a href="/static/ManageVehicles.html" class="nav-link"><i class="bi bi-truck"></i><span> Manage Vehicles</span></a>
  <a href="/static/settings.html" class="nav-link active"><i class="bi bi-gear"></i> <span>Settings</span></a>
  <div class="spacer"></div>
  <div class="logout" onclick="window.location.href='/static/Login.html'">
    <i class="bi bi-box-arrow-right"></i> Logout
  </div>
</nav>

<!-- Main -->
<div class="main">
  <header><h1>Settings</h1></header>

  <div class="settings-grid">
    <div class="card">
      <div class="card-header">
        <h3>User Management</h3>
        <button class="btn" onclick="addUser()"><i class="bi bi-person-plus"></i> Add User</button>
      </div>
      <table id="userTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Position</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <footer>© 2025 FairLift International Logistics</footer>
</div>

<!-- Alert Modal -->
<div id="overlay" class="overlay">
  <div class="modal">
    <h4 id="msgTitle">Notice</h4>
    <p id="msgText">Message here</p>
    <div style="display:flex; justify-content:center; gap:10px; margin-top:10px;">
      <button id="msgOkBtn">OK</button>
    </div>
  </div>
</div>

<!-- Edit Password Modal -->
<div id="editPasswordModal" class="overlay">
  <div class="modal">
    <h4>Edit Password</h4>
    <p id="editUserLabel"></p>
    <div style="position:relative;">
      <input id="newPassword" type="password" placeholder="New Password">
      <i id="toggleEditPassword" class="bi bi-eye"></i>
    </div>
    <div style="display:flex; justify-content:center; gap:10px; margin-top:10px;">
      <button onclick="savePassword()">Save</button>
      <button onclick="closePasswordModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Add User Modal -->
<div id="addUserModal" class="overlay">
  <div class="modal">
    <h4>Add User</h4>
    <input id="addUsername" type="text" placeholder="Username">
    <div style="position:relative;">
      <input id="addPassword" type="password" placeholder="Password">
      <i id="toggleAddPassword" class="bi bi-eye"></i>
    </div>
    <input id="addRole" type="text" placeholder="Role (admin/driver)">
    <input id="addPosition" type="text" placeholder="Position">
    <div style="display:flex; justify-content:center; gap:10px; margin-top:10px;">
      <button onclick="confirmAddUser()">Add</button>
      <button onclick="closeAddUserModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const USERS_API = "/api/users";
let editUserId = null;

// Central modal function
function showMsg(title, text, onConfirm=null){
  const overlay = document.getElementById('overlay');
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgText').textContent = text;
  overlay.style.display = 'flex';

  const btn = document.getElementById('msgOkBtn');
  btn.onclick = () => {
    overlay.style.display = 'none';
    if(onConfirm) onConfirm();
  }
}

// Load users
async function loadUsers(){
  try{
    const res = await fetch(USERS_API);
    const users = await res.json();
    const tbody = document.querySelector("#userTable tbody");
    tbody.innerHTML = "";
    users.forEach(u=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${u.username}</td>
        <td>${u.role}</td>
        <td>${u.position || ''}</td>
        <td>
          <i class="bi bi-key" title="Edit Password" onclick="openPasswordModal(${u.id}, '${u.username}')"></i>
          &nbsp;&nbsp;
          <i class="bi bi-trash" title="Delete" onclick="confirmDelete(${u.id})"></i>
        </td>`;
      tbody.appendChild(tr);
    });
  } catch { showMsg("Error", "Failed to load users"); }
}

// Add user modal
function addUser(){ document.getElementById('addUserModal').style.display='flex'; }
function closeAddUserModal(){ document.getElementById('addUserModal').style.display='none'; }

// Password modal
function openPasswordModal(id, username){
  editUserId = id;
  document.getElementById('editUserLabel').textContent = `Update password for ${username}`;
  document.getElementById('newPassword').value = '';
  document.getElementById('editPasswordModal').style.display='flex';
}
function closePasswordModal(){ document.getElementById('editPasswordModal').style.display='none'; }

// Add user
async function confirmAddUser(){
  const username = document.getElementById('addUsername').value.trim();
  const password = document.getElementById('addPassword').value.trim();
  const role = document.getElementById('addRole').value.trim();
  const position = document.getElementById('addPosition').value.trim();

  if(!username || !password) return showMsg("Error", "Username & password required");

  try{
    const res = await fetch(USERS_API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username, password, role, position})
    });
    if(res.ok){
      closeAddUserModal();
      showMsg("Success", "User added", loadUsers);
    } else {
      const err = await res.json();
      showMsg("Error", err.error || "Failed");
    }
  } catch { showMsg("Error", "Server connection failed"); }
}

// Save password
async function savePassword(){
  const newPass = document.getElementById('newPassword').value.trim();
  if(!newPass) return showMsg("Error", "Enter a new password");

  try{
    const res = await fetch(`${USERS_API}/${editUserId}`, {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: newPass})
    });
    if(res.ok){
      closePasswordModal();
      showMsg("Success", "Password updated");
    } else {
      showMsg("Error", "Failed to update");
    }
  } catch { showMsg("Error", "Server connection failed"); }
}

// Delete user with modal confirm
function confirmDelete(id){
  showMsg("Confirm", "Are you sure you want to delete this user?", () => deleteUser(id));
}
async function deleteUser(id){
  try{
    const res = await fetch(`${USERS_API}/${id}`, {method:"DELETE"});
    if(res.ok){
      showMsg("Deleted", "User deleted", loadUsers);
    } else { showMsg("Error", "Delete failed"); }
  } catch { showMsg("Error", "Connection failed"); }
}

// Toggle password visibility
document.getElementById('toggleEditPassword').addEventListener('click', () => {
  const input = document.getElementById('newPassword');
  const icon = document.getElementById('toggleEditPassword');
  if(input.type === 'password'){ input.type = 'text'; icon.classList.replace('bi-eye','bi-eye-slash'); } 
  else { input.type = 'password'; icon.classList.replace('bi-eye-slash','bi-eye'); }
});
document.getElementById('toggleAddPassword').addEventListener('click', () => {
  const input = document.getElementById('addPassword');
  const icon = document.getElementById('toggleAddPassword');
  if(input.type === 'password'){ input.type = 'text'; icon.classList.replace('bi-eye','bi-eye-slash'); } 
  else { input.type = 'password'; icon.classList.replace('bi-eye-slash','bi-eye'); }
});

// Initial load
loadUsers();
</script>

</body>
</html>
