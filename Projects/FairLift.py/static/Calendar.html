<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FairLift — Calendar</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">

  <style>
    :root {
      --accent: #3E5879;
      --accent-dark: #2d4059;
      --bg: #f6f6f8;
      --card: #ffffff;
      --muted: #666;
      --radius: 16px;
      font-family: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      min-height: 100vh;
      color: #222;
      background: linear-gradient(135deg, #dce3ed 0%, #ffffff 100%);
      background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.6) 0 20%, transparent 20%),
                        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.5) 0 25%, transparent 25%),
                        linear-gradient(135deg, #dce3ed 0%, #f4f7fb 100%);
      background-blend-mode: overlay;
      font-family: 'Inter', sans-serif;
    }

    /* Sidebar */
    .sidebar {
      width: 230px;
      background: var(--accent);
      color: white;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      padding: 25px 15px;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }

    .sidebar h2 {
      text-align: center;
      font-size: 22px;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    .nav-link {
      color: #fff;
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-radius: 10px;
      margin: 6px 0;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .nav-link i { margin-right: 12px; font-size: 1.2rem; }
    .nav-link:hover { background: rgba(255, 255, 255, 0.15); transform: translateX(4px); }
    .nav-link.active { background: #fff; color: var(--accent); font-weight: 600; }

    .spacer { flex-grow: 1; }

    /* Sidebar Logout Button (red) */
    .logout {
      background: #e74c3c; /* red background */
      color: #fff;          /* white text */
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
    }
    .logout:hover { background: #c0392b; }

    /* Main */
    .main {
      flex-grow: 1;
      margin-left: 230px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: white;
      padding: 20px 30px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    header h1 {
      font-size: 22px;
      color: var(--accent-dark);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .content {
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.25s ease;
    }

    .card:hover { transform: translateY(-3px); }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(6px);
      animation: fadeIn 0.3s ease;
    }
    .modal.show { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: rgba(255,255,255,0.9);
      border-radius: var(--radius);
      padding: 25px 28px;
      width: 560px;
      max-width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      animation: scaleUp 0.3s ease;
      backdrop-filter: blur(10px);
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-card h3 {
      margin-bottom: 12px;
      color: var(--accent-dark);
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
      color: #333;
    }

    input, textarea, select {
      width: 100%;
      padding: 9px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(62,88,121,0.2);
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn.save { background: var(--accent); }
    .btn.cancel { background: #777; }
    .btn.delete { background: #e74c3c; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    #calendar { --fc-today-bg-color: rgba(62,88,121,0.1); }
    .fc-toolbar-title {
      color: var(--accent-dark);
      font-weight: 700 !important;
    }
  </style>
</head>

<body>
  <nav class="sidebar">
    <h2>FAIRLIFT</h2>
    <a href="/static/DashBoard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/static/Calendar.html" class="nav-link active"><i class="bi bi-calendar3"></i> Calendar</a>
    <a href="/static/warehouse.html" class="nav-link"><i class="bi bi-box-seam"></i> Warehouse</a>
    <a href="/static/archived.html" class="nav-link"><i class="bi bi-archive"></i> Archived Parcels</a>
    <a href="/static/tracking_live_auto.html" class="nav-link"><i class="bi bi-truck"></i> Live Tracking</a>
    <a href="/static/add_parcel.html" class="nav-link"><i class="bi bi-plus-circle"></i> Add Parcel</a>
    <a href="/static/settings.html" class="nav-link"><i class="bi bi-gear"></i> Settings</a>

    <div class="spacer"></div>

    <a href="#" class="logout" id="logoutBtn">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </nav>

  <div class="main">
    <header>
      <h1>Calendar — Events</h1>
    </header>

    <div class="content">
      <div class="card">
        <div id="calendar"></div>
      </div>
    </div>
  </div>

  <!-- Event Modal -->
  <div id="eventModal" class="modal">
    <div class="modal-card">
      <h3 id="modalTitle">New Event</h3>
      <form id="eventForm">
        <input type="hidden" id="eventId">
        <label>Title</label>
        <input id="title" required>
        <label>Start</label>
        <input id="start" type="datetime-local" required>
        <label>End</label>
        <input id="end" type="datetime-local">
        <label>Description</label>
        <textarea id="description" rows="3"></textarea>

        <div class="modal-actions">
          <button type="button" id="deleteBtn" class="btn delete">Delete</button>
          <button type="submit" class="btn save">Save</button>
          <button type="button" id="cancelBtn" class="btn cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Alert Modal -->
  <div id="alertModal" class="modal">
    <div class="modal-card" style="max-width:400px;text-align:center;">
      <h3 id="alertMessage"></h3>
      <div style="margin-top:20px;">
        <button class="btn save" id="alertOkBtn">OK</button>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmModal" class="modal">
    <div class="modal-card" style="max-width:400px;text-align:center;">
      <h3 id="confirmMessage"></h3>
      <div class="modal-actions" style="justify-content:center; margin-top:20px;">
        <button class="btn save" id="confirmYesBtn">Yes</button>
        <button class="btn cancel" id="confirmNoBtn">No</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script>
    const calendarEl = document.getElementById('calendar');
    let calendar;
    let confirmCallback = null; // store callback for confirm

    function openModal(mode, ev) {
      document.getElementById('eventForm').reset();
      document.getElementById('eventId').value = '';
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('modalTitle').textContent = mode === 'edit' ? 'Edit Event' : 'New Event';
      if (ev) {
        document.getElementById('eventId').value = ev.id || '';
        document.getElementById('title').value = ev.title || '';
        if (ev.start) document.getElementById('start').value = new Date(ev.start).toISOString().slice(0,16);
        if (ev.end) document.getElementById('end').value = new Date(ev.end).toISOString().slice(0,16);
        document.getElementById('description').value = ev.description || '';
        document.getElementById('deleteBtn').style.display = 'inline-block';
      }
      document.getElementById('eventModal').classList.add('show');
    }

    function closeModal() { document.getElementById('eventModal').classList.remove('show'); }

    function showAlert(message) {
      const modal = document.getElementById('alertModal');
      document.getElementById('alertMessage').textContent = message;
      modal.classList.add('show');
    }

    document.getElementById('alertOkBtn').addEventListener('click', () => {
      document.getElementById('alertModal').classList.remove('show');
    });

    function showConfirm(message, callback) {
      confirmCallback = callback;
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmMessage').textContent = message;
      modal.classList.add('show');
    }

    document.getElementById('confirmYesBtn').addEventListener('click', () => {
      document.getElementById('confirmModal').classList.remove('show');
      if (confirmCallback) confirmCallback(true);
    });

    document.getElementById('confirmNoBtn').addEventListener('click', () => {
      document.getElementById('confirmModal').classList.remove('show');
      if (confirmCallback) confirmCallback(false);
    });

    async function fetchEvents(info, successCallback, failureCallback) {
      try {
        const res = await fetch('/api/events', { credentials: 'include' });
        const events = await res.json();
        successCallback(events.map(e => ({
          id: e.id.toString(),
          title: e.title,
          start: e.start,
          end: e.end || null,
          extendedProps: { description: e.description || '' }
        })));
      } catch (err) { failureCallback(err); }
    }

    document.addEventListener('DOMContentLoaded', function() {
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        selectable: true,
        editable: true,
        eventSources: [fetchEvents],
        select: info => openModal('new', { start: info.startStr, end: info.endStr }),
        eventClick: info => openModal('edit', {
          id: info.event.id,
          title: info.event.title,
          start: info.event.start?.toISOString(),
          end: info.event.end?.toISOString(),
          description: info.event.extendedProps.description
        }),
        eventDrop: info => updateEventOnServer(info.event),
        eventResize: info => updateEventOnServer(info.event)
      });
      calendar.render();
    });

    async function updateEventOnServer(ev) {
      const payload = {
        title: ev.title,
        start: ev.start ? ev.start.toISOString() : null,
        end: ev.end ? ev.end.toISOString() : null,
        description: ev.extendedProps.description || ''
      };
      try {
        await fetch('/api/events/' + ev.id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload)
        });
      } catch (err) { showAlert('Update failed'); console.error('Update failed', err); }
    }

    document.getElementById('eventForm').addEventListener('submit', async e => {
      e.preventDefault();
      const id = document.getElementById('eventId').value;
      const payload = {
        title: document.getElementById('title').value,
        start: document.getElementById('start').value ? new Date(document.getElementById('start').value).toISOString() : null,
        end: document.getElementById('end').value ? new Date(document.getElementById('end').value).toISOString() : null,
        description: document.getElementById('description').value
      };
      const url = id ? '/api/events/' + id : '/api/events';
      const method = id ? 'PUT' : 'POST';
      try {
        const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(payload) });
        if (res.ok) { closeModal(); calendar.refetchEvents(); } else { showAlert('Error saving event'); }
      } catch (err) { showAlert('Error saving event'); console.error(err); }
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      const id = document.getElementById('eventId').value;
      if (!id) return;
      showConfirm('Delete this event?', async confirmed => {
        if (!confirmed) return;
        const res = await fetch('/api/events/' + id, { method: 'DELETE', credentials: 'include' });
        if (res.ok) { closeModal(); calendar.refetchEvents(); } else { showAlert('Delete failed'); }
      });
    });

    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    // Logout redirect
    document.getElementById('logoutBtn').addEventListener('click', e => {
      e.preventDefault();
      sessionStorage.clear();
      window.location.href = '/static/Login.html';
    });
  </script>
</body>
</html>
