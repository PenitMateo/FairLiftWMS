<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FairLift — Manage Vehicles</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root {
  --accent: #3E5879;
  --accent-light: #5A7299;
  --bg: #f8f9fa;
  --card-bg: #fff;
  --border: #dcdfe3;
  --text: #333;
  --text-muted: #666;
  font-family: "Inter", sans-serif;
}
* { box-sizing: border-box; margin:0; padding:0; }
body { display: flex; min-height: 100vh; background: var(--bg); color: var(--text); }
.sidebar { width: 220px; background: var(--accent); color: #fff; display: flex; flex-direction: column; height: 100vh; position: fixed; top: 0; left: 0; padding: 25px 15px; box-shadow: 2px 0 10px rgba(0,0,0,0.12); transition: all 0.3s ease; }
.sidebar h2 { font-size: 20px; font-weight: 700; margin-bottom: 30px; text-align: center; letter-spacing: 1px; white-space: nowrap; overflow: hidden; }
.nav-link { color: #fff; display: flex; align-items: center; padding: 12px 14px; border-radius: 8px; margin: 6px 0; font-weight: 500; text-decoration: none; transition: all 0.25s; white-space: nowrap; overflow: hidden; }
.nav-link i { margin-right: 10px; font-size: 1.2rem; min-width: 20px; text-align: center; }
.nav-link span { display: inline; }
.nav-link:hover { background: rgba(255,255,255,0.15); transform: translateX(3px); }
.nav-link.active { background: #fff; color: var(--accent); font-weight: 600; }
.spacer { flex-grow:1; }
.logout { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; margin-top: 10px; background:#e74c3c; border-radius:8px; font-weight:600; cursor:pointer; transition:0.3s; white-space: nowrap; }
.logout:hover { background:#c0392b; }
.main { margin-left: 220px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; background: var(--bg); transition: margin-left 0.3s ease; }
header { text-align:center; margin-bottom:30px; }
header h1 { font-size:28px; color: var(--accent); font-weight:700; }
.card { background: var(--card-bg); border-radius: 16px; padding: 30px 35px; width: 100%; max-width: 700px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); transition: all 0.3s; margin-bottom:30px;}
.card:hover { box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 25px; }
label { font-weight:600; font-size:14px; margin-bottom:6px; display:block; color: var(--text); }
input { width: 100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; transition: all 0.2s; }
input:focus { border-color: var(--accent); outline:none; box-shadow:0 0 0 3px rgba(62,88,121,0.15); }
.btn { grid-column: span 2; justify-self:center; background: var(--accent); color: #fff; border:none; padding:12px 22px; border-radius:8px; cursor:pointer; font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; transition:0.2s; margin-top:10px;}
.btn:hover { background: var(--accent-light); transform: translateY(-1px); }
.vehicle-list { width:100%; border-collapse: collapse; margin-top:15px; }
.vehicle-list th, .vehicle-list td { padding:10px 12px; border:1px solid var(--border); text-align:left; }
.vehicle-list th { background: var(--accent); color:#fff; }
.vehicle-list td button { background:#e74c3c; color:#fff; border:none; padding:4px 8px; border-radius:5px; cursor:pointer;}
.vehicle-list td button:hover { background:#c0392b; }
footer { margin-top:30px; font-size:13px; color:var(--text-muted); text-align:center; }

/* Responsive Sidebar */
@media(max-width:768px) {
  .sidebar { width:60px; padding:20px 6px; overflow:hidden; }
  .sidebar h2 { display:none; }
  .nav-link { justify-content:center; padding:10px 0; }
  .nav-link i { margin:0; font-size:1.3rem; }
  .nav-link span { display:none; }
  .main { margin-left:60px; padding:20px; }
  form { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<nav class="sidebar">
  <h2>FAIRLIFT</h2>
  <a href="/static/DashBoard.html" class="nav-link"><i class="bi bi-speedometer2"></i><span> Dashboard</span></a>
  <a href="/static/Calendar.html" class="nav-link"><i class="bi bi-calendar3"></i><span> Calendar</span></a>
  <a href="/static/warehouse.html" class="nav-link"><i class="bi bi-box-seam"></i><span> Warehouse</span></a>
  <a href="/static/archived.html" class="nav-link"><i class="bi bi-archive"></i><span> Archived Parcels</span></a>
  <a href="/static/tracking_live_auto.html" class="nav-link"><i class="bi bi-truck"></i><span> Live Tracking</span></a>
  <a href="/static/add_parcel.html" class="nav-link"><i class="bi bi-plus-circle"></i><span> Add Parcel</span></a>
  <a href="/static/manage_vehicles.html" class="nav-link active"><i class="bi bi-truck"></i><span> Manage Vehicles</span></a>
  <a href="/static/settings.html" class="nav-link"><i class="bi bi-gear"></i><span> Settings</span></a>
  <div class="spacer"></div>
  <div class="logout" onclick="window.location.href='/static/Login.html'"><i class="bi bi-box-arrow-right"></i><span> Logout</span></div>
</nav>

<div class="main">
  <header><h1>Manage Vehicles</h1></header>

  <div class="card">
    <form id="vehicleForm">
      <div>
        <label>Vehicle Name</label>
        <input name="name" id="vehicleName" placeholder="e.g. Truck A" required>
      </div>
      <div>
        <label>Max Weight (kg)</label>
        <input name="maxWeight" id="vehicleWeight" type="number" step="0.01" placeholder="e.g. 1000" required>
      </div>
      <button type="submit" class="btn"><i class="bi bi-plus-circle"></i> Add Vehicle</button>
    </form>
  </div>

  <div class="card">
    <h3>Vehicle List</h3>
    <table class="vehicle-list" id="vehicleTable">
      <thead>
        <tr><th>Name</th><th>Max Weight (kg)</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>© 2025 FairLift International Logistics</footer>
</div>

<script>
let vehicles = JSON.parse(localStorage.getItem('vehicles')) || [];

function saveVehicles() {
  localStorage.setItem('vehicles', JSON.stringify(vehicles));
  renderVehicleList();
}

function renderVehicleList() {
  const tbody = document.getElementById('vehicleTable').querySelector('tbody');
  tbody.innerHTML = '';
  vehicles.forEach((v, idx)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${v.name}</td>
      <td>${v.maxWeight}</td>
      <td><button onclick="deleteVehicle(${idx})"><i class="bi bi-trash"></i> Delete</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function deleteVehicle(index){
  if(confirm('Delete this vehicle?')){
    vehicles.splice(index,1);
    saveVehicles();
  }
}

document.getElementById('vehicleForm').addEventListener('submit', e=>{
  e.preventDefault();
  const name = document.getElementById('vehicleName').value.trim();
  const maxWeight = parseFloat(document.getElementById('vehicleWeight').value);
  if(!name || isNaN(maxWeight) || maxWeight <=0){
    alert('Enter valid vehicle name and max weight');
    return;
  }
  vehicles.push({name,maxWeight});
  saveVehicles();
  e.target.reset();
});

renderVehicleList();
</script>

</body>
</html>
