<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FairLift — Warehouse</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root {
  --accent: #3E5879;
  --accent-dark: #5A7299;
  --bg: #ffffff;
  --card: #ffffff;
  --muted: #666;
  font-family: 'Inter', sans-serif;
}

/* Global reset */
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  font-family: 'Inter', sans-serif;
  color: #333;
  background-color: var(--bg);
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: var(--accent);
  color: #fff;
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: fixed;
  top: 0;
  left: 0;
  padding: 24px 16px;
  box-shadow: 3px 0 10px rgba(0,0,0,.12);
  z-index: 1000;
  transition: all 0.3s ease;
}
.sidebar h2 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 28px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.nav-items { display: flex; flex-direction: column; flex-grow: 1; gap: 6px; }
.nav-link {
  display: flex;
  align-items: center;
  color: #fff;
  padding: 10px 12px;
  border-radius: 8px;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.25s ease;
}
.nav-link i { margin-right: 10px; font-size: 1.2rem; opacity: 0.9; }
.nav-link:hover { background: rgba(255,255,255,0.15); transform: translateX(4px); }
.nav-link.active { background: #fff; color: var(--accent); font-weight: 600; }
.logout {
  background: #e74c3c;
  color: #fff;
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
  font-weight: 600;
  margin-top: 12px;
  transition: all 0.3s ease;
}
.logout:hover { background: #c0392b; }

/* Main Content */
.main { margin-left: 240px; flex-grow: 1; display: flex; flex-direction: column; min-height: 100vh; padding: 0; }
header {
  background: #fff;
  padding: 20px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
  z-index: 500;
}
header h1 { margin: 0; color: var(--accent); font-size: 22px; font-weight: 700; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
header .table-actions { display: flex; align-items: center; gap: 10px; }

/* Buttons */
.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: 0.3s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
.ghost { background: white; border: 1px solid #ccc; color: #333; }

/* Card / Table */
.card { background: var(--card); border-radius: 14px; padding: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.05); overflow-x: auto; margin: 20px; }
table { width: 100%; border-collapse: collapse; min-width: 800px; }
th, td { padding: 12px 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
th { background: #f9f9f9; font-weight: 600; color: #444; }
tr { transition: all 0.25s ease; }
tr:hover { background: #f2f2f2; transform: scale(1.005); }
td button { margin-right: 4px; font-size: 13px; }

/* Footer */
footer { text-align: center; color: #777; padding: 16px 0; font-size: 13px; border-top: 1px solid #eee; }

/* Modal */
.modal-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.modal-box {
  background: #fff;
  border-radius: 16px;
  padding: 28px 30px;
  width: 360px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}
.modal-box h3 { color: var(--accent); font-size: 19px; font-weight: 700; margin-bottom: 16px; }
.modal-box label { font-size: 13px; color: #444; font-weight: 500; }
.modal-box input, .modal-box select { width: 100%; padding: 8px; margin: 6px 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
.modal-actions { text-align: right; margin-top: 10px; }

/* Responsive Sidebar */
@media (max-width: 768px) {
  .sidebar { width: 70px; padding: 18px 8px; }
  .sidebar h2 { display: none; }
  .nav-link { justify-content: center; padding: 8px 0; }
  .nav-link i { margin: 0; font-size: 1.3rem; }
  .nav-link span { display: none; }
  .main { margin-left: 70px; }
  header { flex-direction: column; align-items: flex-start; gap: 10px; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <h2>FAIRLIFT</h2>
  <div class="nav-items">
    <a href="/static/DashBoard.html" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    <a href="/static/Calendar.html" class="nav-link"><i class="bi bi-calendar3"></i><span>Calendar</span></a>
    <a href="/static/warehouse.html" class="nav-link active"><i class="bi bi-box-seam"></i><span>Warehouse</span></a>
    <a href="/static/archived.html" class="nav-link"><i class="bi bi-archive"></i><span>Archived Parcels</span></a>
    <a href="/static/tracking_live_auto.html" class="nav-link"><i class="bi bi-truck"></i><span>Live Tracking</span></a>
    <a href="/static/add_parcel.html" class="nav-link"><i class="bi bi-plus-circle"></i><span>Add Parcel</span></a>
    <a href="/static/settings.html" class="nav-link"><i class="bi bi-gear"></i><span>Settings</span></a>
  </div>
  <a href="/static/Login.html" class="logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
</nav>

<!-- Main Content -->
<div class="main">
  <header>
    <div>
      <h1>Warehouse Monitoring</h1>
      <p>View and manage all stored parcels efficiently.</p>
    </div>
    <div class="table-actions">
      <button id="addParcelBtn" class="btn"><i class="bi bi-plus-circle"></i> Add Parcel</button>
      <input type="text" id="searchInput" placeholder="Search parcels..." style="padding:6px 10px; border-radius:6px; border:1px solid #ccc; font-size:14px;">
    </div>
  </header>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Tracking #</th>
          <th>Size</th>
          <th>Weight</th>
          <th>Shipping Date</th>
          <th>Destination</th>
          <th>Status</th>
          <th>Location</th>
          <th>Assigned Vehicle</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>© 2025 FairLift International Logistics</footer>
</div>

<script>
let currentParcels = [];

// Vehicles
function getVehicles() { return JSON.parse(localStorage.getItem('vehicles')) || ["Motorcycle","Express Van","Cargo Van","Small Truck","Large Truck"]; }
function autoAssignVehicle(weight) {
  const vehicles = getVehicles();
  weight = parseFloat(weight);
  if (isNaN(weight)) return "Unassigned";
  if (weight < 2) return vehicles.includes("Motorcycle") ? "Motorcycle" : vehicles[0];
  if (weight < 10) return vehicles.includes("Express Van") ? "Express Van" : vehicles[0];
  if (weight < 30) return vehicles.includes("Cargo Van") ? "Cargo Van" : vehicles[0];
  if (weight < 100) return vehicles.includes("Small Truck") ? "Small Truck" : vehicles[0];
  return vehicles.includes("Large Truck") ? "Large Truck" : vehicles[0];
}

// Modal
function showMsg(title, text) {
  const modal = document.createElement("div");
  modal.className = "modal-bg";
  modal.innerHTML = `
    <div class="modal-box">
      <h3>${title}</h3>
      <p>${text}</p>
      <div class="modal-actions">
        <button class="btn" onclick="this.closest('.modal-bg').remove()">OK</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

// Load parcels
async function loadParcels() {
  try {
    const res = await fetch("/api/parcels", { credentials: 'include' });
    const data = await res.json();
    data.forEach(p => { if (!p.assigned_vehicle || p.assigned_vehicle==="") p.assigned_vehicle = autoAssignVehicle(p.weight); });
    currentParcels = data;
    renderTable(data);
  } catch(err) { console.error(err); showMsg("Error","Failed to load parcels."); }
}

// Render table
function renderTable(items) {
  const tableBody = document.getElementById('tableBody');
  tableBody.innerHTML = '';
  items.filter(p => p.status !== 'archived').forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.tracking_number||''}</td>
      <td>${p.size||''}</td>
      <td>${p.weight||''}</td>
      <td>${p.shipping_date||''}</td>
      <td>${p.destination||''}</td>
      <td>${p.status||''}</td>
      <td>${p.location_rack||''}</td>
      <td>${p.assigned_vehicle||''}</td>
      <td>
        <button class="btn" style="background:#0078d7" onclick="openEdit(${p.id})"><i class="bi bi-pencil"></i></button>
        <button class="btn" style="background:#d9534f" onclick="confirmDelete(${p.id})"><i class="bi bi-trash"></i></button>
        <button class="btn" style="background:#6c757d" onclick="archiveParcel(${p.id})"><i class="bi bi-archive"></i></button>
        <button class="btn" style="background:#17a2b8" onclick="checkImage(${p.id})"><i class="bi bi-image"></i> Check Image</button>
      </td>`;
    tableBody.appendChild(tr);
  });
}

// Edit parcel
function openEdit(id) {
  const parcel = currentParcels.find(p => p.id === id);
  if (!parcel) return showMsg("Error","Parcel not found");
  const vehicles = getVehicles();
  const vehicleOptions = vehicles.map(v=>`<option value="${v}" ${parcel.assigned_vehicle===v?"selected":""}>${v}</option>`).join('');
  
  const modal = document.createElement("div");
  modal.className = "modal-bg";
  modal.innerHTML = `
    <div class="modal-box">
      <h3>Edit Parcel</h3>
      <label>Destination</label>
      <input id="editDest" value="${parcel.destination||''}">
      <label>Status</label>
      <select id="editStatus">
        <option value="Stored" ${parcel.status==="Stored"?"selected":""}>Stored</option>
        <option value="Pending" ${parcel.status==="Pending"?"selected":""}>Pending</option>
        <option value="Shipped" ${parcel.status==="Shipped"?"selected":""}>Shipped</option>
        <option value="Delay" ${parcel.status==="Delay"?"selected":""}>Delay</option>
      </select>
      <label>Assigned Vehicle</label>
      <select id="editVehicle">${vehicleOptions}</select>
      <div class="modal-actions">
        <button id="saveEdit" class="btn">Save</button>
        <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  document.getElementById("saveEdit").onclick = async () => {
    const updated = {
      destination: document.getElementById("editDest").value,
      status: document.getElementById("editStatus").value,
      assigned_vehicle: document.getElementById("editVehicle").value
    };
    const res = await fetch(`/api/parcels/${id}`, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json'},
      body:JSON.stringify(updated),
      credentials:'include'
    });
    if(res.ok){ showMsg("Success","Parcel updated successfully."); modal.remove(); loadParcels(); }
    else showMsg("Error","Failed to update parcel.");
  };
}

// Delete parcel
async function confirmDelete(id){
  const modal=document.createElement("div");
  modal.className="modal-bg";
  modal.innerHTML=`
    <div class="modal-box">
      <h3>Delete Parcel</h3>
      <p>Are you sure you want to delete this parcel?</p>
      <div class="modal-actions">
        <button class="btn" id="confirmYes">Yes</button>
        <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById("confirmYes").onclick=async ()=>{
    const res=await fetch(`/api/parcels/${id}`,{method:'DELETE',credentials:'include'});
    if(res.ok){ showMsg("Deleted","Parcel deleted successfully."); modal.remove(); loadParcels(); }
    else showMsg("Error","Failed to delete parcel");
  };
}

// Archive parcel
async function archiveParcel(id){
  const res=await fetch(`/api/parcels/${id}/archive`,{method:'POST',credentials:'include'});
  if(res.ok){ showMsg("Archived","Parcel archived successfully"); loadParcels(); }
  else showMsg("Error","Failed to archive parcel");
}

// Image checker
function checkImage(id) {
  const parcel = currentParcels.find(p => p.id === id);
  if (!parcel) return showMsg("Error","Parcel not found");
  const imageUrl = parcel.image_url || '';
  if(!imageUrl) return showMsg("No Image","This parcel has no image uploaded.");
  const modal = document.createElement("div");
  modal.className = "modal-bg";
  modal.innerHTML = `
    <div class="modal-box" style="width:400px;">
      <h3>Parcel Image</h3>
      <img src="${imageUrl}" alt="Parcel Image" style="width:100%; border-radius:8px; margin-top:10px;">
      <div class="modal-actions">
        <button class="btn" onclick="this.closest('.modal-bg').remove()">Close</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

// Add Parcel button
document.getElementById('addParcelBtn').onclick = ()=> window.location.href='/static/add_parcel.html';

// Search Filter
document.getElementById('searchInput').addEventListener('input',function(){
  const query=this.value.toLowerCase();
  const filtered=currentParcels.filter(p=>
    (p.tracking_number&&p.tracking_number.toLowerCase().includes(query))||
    (p.destination&&p.destination.toLowerCase().includes(query))||
    (p.status&&p.status.toLowerCase().includes(query))||
    (p.location_rack&&p.location_rack.toLowerCase().includes(query))||
    (p.assigned_vehicle&&p.assigned_vehicle.toLowerCase().includes(query))
  );
  renderTable(filtered);
});

// Manage Vehicles Button
const manageVehiclesBtn = document.createElement('button');
manageVehiclesBtn.className='btn';
manageVehiclesBtn.innerHTML='<i class="bi bi-truck"></i> Manage Vehicles';
manageVehiclesBtn.onclick=()=> window.location.href='/static/ManageVehicles.html';
document.querySelector('.table-actions').appendChild(manageVehiclesBtn);

loadParcels();
</script>
</body>
</html>
