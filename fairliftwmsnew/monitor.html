<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FairLift — Warehouse Monitoring</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#0f1724; 
      --card:#0b1220; 
      --muted:#9aa4b2; 
      --accent:#06b6d4;
      --success:#10b981; 
      --danger:#ef4444; 
      --glass: rgba(255,255,255,0.03);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%; margin:0;
      background:linear-gradient(180deg,#071029 0%, #071827 100%);
      color:#e6eef6; display:flex;
    }

    /* Sidebar */
    .sidebar{
      width:220px;
      background:var(--card);
      color:var(--muted);
      padding:20px;
      border-right:1px solid rgba(255,255,255,0.08); /* subtle divider */
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .sidebar h2{
      font-size:16px;
      font-weight:700;
      color:var(--accent);
      margin-bottom:20px;
    }
    .sidebar a{
      text-decoration:none;
      color:var(--muted);
      font-size:14px;
      padding:6px 8px;
      border-radius:6px;
      transition:background 0.2s, color 0.2s;
    }
    .sidebar a:hover{
      background:rgba(255,255,255,0.05);
      color:#fff;
    }

    /* Main content */
    .main{
      flex:1;
      padding:24px;
      overflow-y:auto;
    }

    /* Existing styles */
    .container{max-width:1200px; margin:0 auto; padding:24px;}
    header{display:flex; align-items:center; justify-content:space-between; gap:16px;}
    h1{margin:0; font-size:20px;}
    p.lead{margin:4px 0 0; color:var(--muted); font-size:13px;}
    .card{background:var(--card); border-radius:12px; padding:16px; box-shadow:0 6px 24px rgba(2,6,23,0.6); margin-top:20px;}
    .controls{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
    .controls > *{background:var(--glass); border:1px solid rgba(255,255,255,0.03); padding:8px 10px; border-radius:8px; color:var(--muted);}
    input[type="text"], select, input[type="date"]{background:transparent; border:0; color:var(--muted); outline:none; min-width:140px;}
    button.btn{background:linear-gradient(90deg,var(--accent), #38bdf8); color:#021325; border:0; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600;}
    button.ghost{background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--muted); cursor:pointer; padding:8px 10px; border-radius:8px;}
    table{width:100%; border-collapse:collapse; margin-top:12px; font-size:14px;}
    th,td{padding:10px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.03); color:#d9e8f2;}
    th{position:relative; cursor:pointer; user-select:none; color:var(--muted); font-weight:600;}
    tr:hover{background:rgba(255,255,255,0.02);}
    .badge{padding:4px 8px; border-radius:999px; font-size:12px; display:inline-block; color:#021325;}
    .badge.stored{background:var(--accent); color:#021325;}
    .modal{position:fixed; left:0; right:0; top:0; bottom:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.45); z-index:40;}
    .modal.show{display:flex;}
    .modal-card{width:760px; max-width:95%; background:linear-gradient(180deg,#041427,#062034); padding:18px; border-radius:12px; box-shadow:0 20px 60px rgba(2,6,23,0.6);}
    .row{display:flex; gap:12px; flex-wrap:wrap;}
    .col{flex:1;}
    .muted{color:var(--muted); font-size:13px;}
    .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:12px;}
    .small{font-size:13px;}
    .table-actions{display:flex; gap:8px; align-items:center;}
    .export-btn{background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.03); padding:6px 8px; border-radius:8px; cursor:pointer;}
    footer{color:var(--muted); font-size:13px; text-align:center; margin-top:18px;}
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>FAIRLIFT</h2>
    <a href="#">Dashboard</a>
    <a href="#">Tracking</a>
    <a href="#">Orders</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
    <a href="#">Help Center</a>
  </div>
      </div>
    </div>
  </div>
</body>
</html>
